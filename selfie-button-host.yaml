esphome:
  name: selfie-button-host
  friendly_name: Selfie Button Host

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

selfie_button:
  connected:
    name: "Connected"
  events:
    name: "Button"
  forget_bond:
    name: "Forget Bond"
