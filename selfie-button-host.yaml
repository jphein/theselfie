esphome:
  name: selfie-button-host
  friendly_name: Selfie Button Host

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Slot 1 keeps the original entity names so existing dashboard/automation
# references (…_connected, …_button, …_forget_bond) stay stable.
selfie_button:
  devices:
    - slug: gabba
      model: gabba_selfie
      connected:
        name: "Connected"
      events:
        name: "Button"
      pair:
        name: "Forget Bond"
    - slug: remote2
      model: generic
      connected:
        name: "Remote 2 Connected"
      events:
        name: "Remote 2 Button"
      pair:
        name: "Remote 2 Pair"
